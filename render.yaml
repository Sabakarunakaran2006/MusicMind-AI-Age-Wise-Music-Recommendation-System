services:
  # -------------------------------------------------------------
  # Single Full-Stack Web Service on Render Free Tier
  # -------------------------------------------------------------
  - type: web
    name: musicmind-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt && python -m backend.app.db.seed"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
